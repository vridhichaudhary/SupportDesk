name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linting Tools
        run: |
          pip install ruff black mypy
      - name: Run Ruff
        run: ruff check ./support-portal-backend
      - name: Run Black
        run: black --check ./support-portal-backend
      - name: Run MyPy
        run: mypy ./support-portal-backend/src

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./support-portal-frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./support-portal-frontend
        run: npm ci
      - name: Run ESLint
        working-directory: ./support-portal-frontend
        run: npm run lint

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: supportdesk_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        working-directory: ./support-portal-backend
        run: |
          pip install -r requirements.txt
      - name: Run Pytest
        working-directory: ./support-portal-backend
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/supportdesk_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-for-ci-only-32-characters-long
          ENVIRONMENT: testing
          TESTING: 1
        run: pytest tests/ -v

  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: docker build -t supportdesk-backend:latest ./support-portal-backend
      - name: Build Frontend Image
        run: docker build -t supportdesk-frontend:latest ./support-portal-frontend
      - name: Run Trivy (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'supportdesk-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Run Trivy (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'supportdesk-frontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
