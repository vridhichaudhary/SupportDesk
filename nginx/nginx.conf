# ─────────────────────────────────────────────────────────────────────────────
# SupportDesk AI — Nginx Configuration
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging Format ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;                  # Hide nginx version

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate Limiting Zones ─────────────────────────────────────────────────
    # API rate limit: 30 requests/second per IP (burst of 60)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Auth endpoints: 5 requests/minute per IP (strict anti-brute-force)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # General: 100 req/s for static assets
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    limit_req_status 429;

    # ── Connection Limits ───────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 100;

    # ── Client Configuration ─────────────────────────────────────────────────
    client_max_body_size 50M;           # Allow file uploads up to 50MB
    client_body_timeout 60s;
    client_header_timeout 60s;

    # ── Upstream Definitions ────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    upstream grafana {
        server grafana:3001;
    }

    # ── Include site configs ─────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
