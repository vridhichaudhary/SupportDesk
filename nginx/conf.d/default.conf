# ─────────────────────────────────────────────────────────────────────────────
# SupportDesk — Default Server Block
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # ── Health Check (no rate limit, no logging) ────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /live {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location = /ready {
        access_log off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # ── API Routes (/api/v1/**) ────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;

        # Proxy settings
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                  # Enable keepalive
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Remove CORS headers from backend (Nginx handles them)
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ── Auth Routes (stricter rate limit) ─────────────────────────────────
    location ~ ^/api/v1/auth/(login|signup|customer-signup) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Metrics (restrict to internal/prometheus only) ─────────────────────
    location = /metrics {
        allow 172.16.0.0/12;    # Docker internal networks
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Grafana (monitoring UI) ────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Files (served via Next.js or Nginx) ─────────────────────────
    location /_next/static/ {
        limit_req zone=general_limit burst=200 nodelay;
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Long-term caching for static assets
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        limit_req zone=general_limit burst=200 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Frontend (catch-all) ───────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=100 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Error Pages ────────────────────────────────────────────────────────
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests. Please slow down."}}';
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable."}}';
    }
}
