[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "alembic",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
exclude = [
    "alembic",
    "venv",
]

# SQLAlchemy 1.4 ORM models use the legacy Column[T] declarative style which
# produces unavoidable false positives ("Class cannot subclass Base", var-annotated
# for Enum columns) under the SQLAlchemy 2.0 type stubs.
# ignore_errors is scoped ONLY to models.py; all service/API/repo code is still checked.
[[tool.mypy.overrides]]
module = "src.models"
ignore_errors = true

# BaseRepository uses generic TypeVar bounds that mypy 2.x cannot resolve
# without a sqlalchemy2-stubs plugin. The attr-defined errors here are false positives.
[[tool.mypy.overrides]]
module = "src.repositories.base"
ignore_errors = true
